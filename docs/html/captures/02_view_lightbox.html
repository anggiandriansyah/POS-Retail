<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    font-size: 13px;
    line-height: 1.5;
  }
  .app-shell {
    max-width: 1200px;
    margin: 20px auto;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background: #0f172a;
    border-bottom: 1px solid #334155;
  }
  .badge-root {
    background: #065f46;
    color: #6ee7b7;
    border: 1px solid #059669;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 10px;
  }
  .superadmin-tabs {
    display: flex;
    gap: 8px;
    padding: 16px 24px 0;
    background: #1e293b;
    border-bottom: 1px solid #334155;
  }
  .tab-btn {
    padding: 10px 18px;
    border-radius: 8px 8px 0 0;
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .tab-btn.active {
    background: #0f172a;
    color: #10b981;
    border: 1px solid #334155;
    border-bottom: 1px solid #0f172a;
  }
  .counter-badge {
    background: #dc2626;
    color: #fff;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    margin-left: 6px;
  }
  .content-area {
    padding: 24px;
    background: #0f172a;
  }
  .filter-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 16px;
  }
  .chips {
    display: flex;
    gap: 8px;
  }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid #334155;
    background: #1e293b;
    color: #94a3b8;
  }
  .chip.active {
    background: #065f46;
    border-color: #10b981;
    color: #6ee7b7;
  }
  .search-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 7px 14px;
    color: #f8fafc;
    width: 260px;
    font-size: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #334155;
  }
  th {
    background: #151e2e;
    color: #94a3b8;
    text-align: left;
    padding: 12px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #334155;
  }
  td {
    padding: 13px 14px;
    border-bottom: 1px solid #273549;
    font-size: 12.5px;
  }
  .badge-tier-gamma {
    background: rgba(220, 38, 38, 0.2);
    border: 1px solid rgba(220, 38, 38, 0.4);
    color: #f87171;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
  }
  .badge-tier-beta {
    background: rgba(37, 99, 235, 0.2);
    border: 1px solid rgba(37, 99, 235, 0.4);
    color: #60a5fa;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
  }
  .badge-tier-alpha {
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10.5px;
  }
  .badge-status-pending {
    background: rgba(245, 158, 11, 0.2);
    border: 1px solid rgba(245, 158, 11, 0.4);
    color: #fbbf24;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
  }
  .badge-status-approved {
    background: rgba(16, 185, 129, 0.2);
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
  }
  .badge-status-rejected {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #f87171;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
  }
  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
  .btn-approve {
    background: #059669;
    color: #fff;
  }
  .btn-reject {
    background: #dc2626;
    color: #fff;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid #475569;
    color: #cbd5e1;
  }
  .toast-banner {
    background: #064e3b;
    border: 1px solid #10b981;
    color: #a7f3d0;
    padding: 12px 18px;
    border-radius: 8px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
  }
  .email-card {
    background: #151e2e;
    border: 1px solid #334155;
    border-left: 4px solid #10b981;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 12px;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-box {
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 14px;
    width: 480px;
    padding: 22px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
  }
</style></head>
